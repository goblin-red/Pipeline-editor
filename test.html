<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестовая страница</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      background: #fafafa;
    }
    h1 { color: #b22222; }
    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Pipeline Editor — тестовая страница</h1>
  <p>Если вы видите этот текст, страница работает.</p>
  <button id="btn">Нажми меня</button>
  <p id="out"></p>
  <script>
    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
      count++;
      document.getElementById('out').textContent = 'Нажатий: ' + count;
    });
  </script>
</body>
</html>
