<aside class="panel" id="panel">
  <div class="panel-head" id="panel-head">
    <span class="panel-no" id="panel-no">—</span>
    <span class="panel-kind" id="panel-kind">{{t:editor.panel.nothing}}</span>
    <span class="panel-head-tools">
      <button class="btn btn-icon" id="btn-focus" title="{{t:editor.panel.focus_title}}">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
      </button>
      <button class="btn btn-icon" id="btn-frame" title="{{t:editor.panel.frame_title}}">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8.5h13M13.5 5.5l3 3-3 3"/><path d="M20.5 15.5h-13M10.5 12.5l-3 3 3 3"/></svg>
      </button>
      <button class="btn btn-icon btn-danger" id="btn-delete" title="{{t:common.delete}}">🗑</button>
    </span>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>
